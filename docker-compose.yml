services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: risk_intelligence
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    ports:
      - "5432:5432"
    volumes:
      - risk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  risk_pgdata:
